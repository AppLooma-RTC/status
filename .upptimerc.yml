# Upptime (https://upptime.js.org) configuration for the AppLooma RTC status page.
owner: AppLooma-RTC
repo: status
user-agent: AppLooma-RTC-status

sites:
  - name: Website
    url: https://applooma.dev
  - name: API
    url: https://api.applooma.dev/health/ready
    expectedStatusCodes: [200]
  - name: Console
    url: https://applooma.dev/dashboard/login
  - name: Documentation
    url: https://docs.applooma.dev
  - name: Media server (signaling)
    url: https://sfu.applooma.dev
    expectedStatusCodes: [200, 404]
  - name: TURN relay (TLS 443)
    url: turn.applooma.dev
    port: 443
    check: tcp-ping

status-website:
  cname: status.applooma.dev
  name: AppLooma RTC Status
  logoUrl: https://applooma.dev/favicon.ico
  introTitle: "AppLooma RTC status"
  introMessage: Live availability of the API, console, docs and media servers. Incidents are posted here first.
  themeUrl: https://unpkg.com/@upptime/status-page@1/assets/themes/dark.css
  navbar:
    - title: Status
      href: /
    - title: Docs
      href: https://docs.applooma.dev
    - title: applooma.dev
      href: https://applooma.dev

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems operational

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  graphs: "0 0 * * *"
